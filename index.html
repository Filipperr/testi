<style>
  h1 {
    max-width: fit-content;
    font-size: clamp(48px, 6.7vw, 96px);
    letter-spacing: -0.065em;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.2;
    border-right: 4px solid var(--ink);

    /* VERY SLOW ANIMATION */
    animation:
      kirjoita 18s steps(13, end) infinite,
      vilkku-kursori 1.6s step-end infinite;
  }

  @keyframes kirjoita {
    0%, 100% {
      width: 0;
    }

    /* waits longer before fully typed */
    45%, 70% {
      width: 100%;
    }
  }

  @keyframes vilkku-kursori {
    from, to {
      border-color: transparent;
    }

    50% {
      border-color: var(--ink);
    }
  }
</style>

<script>
  const translations = {
    fi: {
      "hero-title": "Å-Kollektiivi"
    },
    en: {
      "hero-title": "Å-Collective"
    },
    sv: {
      "hero-title": "Å-Kollektivet"
    }
  };

  function changeLang(lang) {
    const h1 = document.getElementById('sivun-otsikko');
    const newTitle = translations[lang]['hero-title'];

    h1.textContent = newTitle;

    /* RESTART VERY SLOW ANIMATION */
    h1.style.animation = 'none';
    h1.offsetHeight;

    h1.style.animation =
      `kirjoita 18s steps(${newTitle.length}, end) infinite,
       vilkku-kursori 1.6s step-end infinite`;
  }
</script>
